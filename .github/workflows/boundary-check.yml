# Boundary check — enforce that parser-cli only imports from bankstatements-core
#
# parser-cli must only depend on bankstatements-core (public).
# Any import outside this boundary is a structural violation.
#
# Trigger: push/PR to main

name: Boundary Check

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/parser-cli/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/parser-cli/**'

permissions:
  contents: read

jobs:
  boundary-check:
    name: Enforce package boundary — parser-cli
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Check for premium imports in parser-cli
      run: |
        echo "Scanning packages/parser-cli/src/ for banned imports..."

        if grep -r "bankstatements_premium\|src\.licensing" packages/parser-cli/src/; then
          echo ""
          echo "BOUNDARY VIOLATION: parser-cli must only import from bankstatements_core."
          exit 1
        fi

        echo "Boundary check passed — no prohibited imports found."
